<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLogistics — Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7l9 5 9-5-9-5zM3 17l9 5 9-5M3 12l9 5 9-5"/>
          </svg>
        </div>
        <span class="logo-text">EcoLogistics</span>
      </a>
      <ul class="nav-links"></ul>
    </div>
    <div class="nav-right">
      <button class="notif-btn" id="notifBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-dot" id="notifDot"></span>
      </button>
      <div class="user-info">
        <div class="user-avatar">AU</div>
        <div class="user-meta">
          <div class="user-name">Admin User</div>
          <div class="user-role">Gerente de Almacén</div>
        </div>
      </div>
      <button id="logoutBtn" title="Cerrar sesión" style="
        width:36px;height:36px;border:1px solid var(--border);border-radius:8px;
        background:var(--white);cursor:pointer;display:flex;align-items:center;
        justify-content:center;transition:background .15s;color:var(--slate);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </nav>

  <main>

    <div class="page-header">
      <h1 class="page-title">Inventario de Productos</h1>
      <button class="btn-primary" onclick="window.location.href='nuevo-producto.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Nuevo Producto
      </button>
    </div>

    <div class="toolbar card">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" id="searchInput"
               placeholder="Buscar por nombre o escaneo QR..."
               oninput="invFilterTable()">
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="invSetFilter('todos', this)">Todos</button>
        <button class="filter-tab" onclick="invSetFilter('bajo stock', this)">Bajo Stock</button>
        <button class="filter-tab" onclick="invSetFilter('critico', this)">Crítico</button>
        <button class="filter-tab" onclick="invSetFilter('sin stock', this)">Sin Stock</button>
      </div>
    </div>

    <div class="card table-card">
      <table class="inv-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock Actual</th>
            <th>Stock Mínimo</th>
            <th>Estado</th>
            <th>QR</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pagination-row">
        <span class="pagination-info" id="paginationInfo"></span>
        <div class="pagination-controls">
          <button class="page-btn" id="prevBtn" onclick="invChangePage(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <div class="page-numbers" id="pageNumbers"></div>
          <button class="page-btn" id="nextBtn" onclick="invChangePage(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="nav.js"></script>
  <script src="inventory.js"></script>

</body>
</html>
